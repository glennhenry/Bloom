<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="topbar-styles">
  <style>
    .topbar {
      width: var(--site-width);
      height: var(--topbar-height);
      display: flex;
      border-bottom: 1px solid var(--border-color);
      z-index: var(--topbar-zindex);
      background: linear-gradient(to bottom, #ffffff, var(--toolbar-gradient-end));
      font-size: 14px;
    }

    .topbar-divider {
      background-color: #ccc;
      width: 1px;
      height: 65px;
      align-self: center;
    }

    .topbar-grid {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .topbar-up {
      min-height: 45px;
      display: flex;
    }

    .topbar-down {
      min-height: 35px;
      display: flex;
    }

    .links {
      width: 600px;
      padding: 0px 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    }

    .links .icon-link {
      width: max-content;
    }

    .links .dropdown-link {
      width: max-content;
    }

    .top-links {
      display: flex;
      gap: 25px;
    }

    .down-arrow {
      margin-left: 2px;
    }

    .dropdown-link {
      position: relative;
      display: flex;
    }

    .dropdown-link-items {
      min-width: max-content;
      position: absolute;
      top: 100%;
      left: 0;
      display: none;
      flex-direction: column;
      gap: 2px;
      border: 1px solid #ccc;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .dropdown-link:hover .dropdown-link-items {
      display: flex;
    }

    .dropdown-link-item {
      display: flex;
      align-items: center;
      padding: 2px 6px;
      gap: 2px;
      white-space: nowrap;
    }

    .dropdown-link-item:not(:last-child) {
      border-bottom: 1px solid #ccc;
    }

    .bottom-links {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .account-info {
      width: 200px;
      display: flex;
      padding: 0px 8px;
      justify-content: end;
      text-align: end;
    }

    .account-info-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .notices {
      width: 550px;
      justify-content: end;
      display: flex;
      padding: 0px 8px;
      align-items: center;
    }

    .notices-link {
      display: flex;
      gap: 20px;
      margin-right: 40px;
    }

    .server-time-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .search {
      width: 250px;
      display: flex;
      gap: 4px;
      justify-content: end;
      padding: 0px 8px;
      align-items: center;
    }

    .search-input {
      all: unset;
      width: 200px;
      height: 25px;
      background-color: white;
      border: 1px solid #ccc;
      padding-left: 4px;
      font-size: 12px;
    }

    .search-action {
      background-color: #dcdcdc;
      padding: 5px;
    }
  </style>
</head>

<body>
  <header class="topbar" th:fragment="topbar (account)">
    <div th:replace="~{fragments/logo :: logo}"></div>
    <div class="topbar-divider"></div>
    <div class="topbar-grid">
      <div class="topbar-up">
        <nav class="links">

            <img src="/icons/temp.png" width="16px">

          </a>
          <a class="icon-link" href="javascript:void(0)">
            <img src="/icons/temp.png" width="16px">
            <p>News</p>
          </a>
          <div></div>
          <div class="dropdown-link">
            <a class="icon-link" href="javascript:void(0)">
              <img src="/icons/dice.png" width="16px" alt="Dice">
              <p>Games</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Wordle</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">

              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Billiard</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Poker</p>
              </a>
            </div>
          </div>
          <div class="dropdown-link">
            <a class="icon-link" href="javascript:void(0)">
              <img src="/icons/temp.png" width="16px">
              <p>Services</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Atlas</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Finance</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Forecast</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/shop.png" width="20px" alt="Shop">
                <p>Mall</p>
              </a>
            </div>
          </div>
          <div class="dropdown-link">
            <a class="icon-link" href="javascript:void(0)">
              <img src="/icons/temp.png" width="16px">
              <p>People</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Community</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Conversation</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Story</p>
              </a>
            </div>
          </div>
          <a class="icon-link" href="javascript:void(0)">
            <img src="/icons/temp.png" width="16px">
            <p>K-pop</p>
          </a>
          <div></div>
          <div class="dropdown-link">
            <a class="icon-link" href="javascript:void(0)">
              <img src="/icons/tool.png" width="16px" alt="Tools">
              <p>Tools</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Calendar</p>
              </a>
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/calculator.png" width="20px" alt="Calculator">
                <p>Calculator</p>
              </a>
              <a class="dropdown-link-item link" href="javascript:void(0)">
                <img src="/icons/temp.png" width="20px">
                <p>Time converter</p>
              </a>
            </div>
          </div>
        </nav>
        <div class="account-info">
          <div th:if="${account != null}">
            <p>Hello, <u th:text="${account.username}"></u></p>
            <a class="link" href="/logout">Logout</a>
          </div>
          <div class="account-info-col" th:if="${account == null}">
            <a class="link" href="/register">Register</a>
            <a class="link" href="/login">Login</a>
          </div>
        </div>
      </div>
      <div class="topbar-down">
        <div class="notices">
          <div class="notices-link">
            <a class="link" href="javascript:void(0)">Help</a>
          </div>
          <div class="server-time-row">
            <p class="server-time">Time: 12:10</p>
            <img src="/icons/clock-black.png" width="22px" alt="Clock">
          </div>
        </div>
        <div class="search">
          <input class="search-input" type="text" placeholder="Search">
          <a class="search-action" href="javascript:void(0)">
            <img src="/icons/search.png" width="16" alt="Search">
          </a>
        </div>
      </div>
    </div>
  </header>
</body>

</html>
